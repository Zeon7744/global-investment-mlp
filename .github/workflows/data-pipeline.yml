# global-investment-mlp: 全球投资数据每日刷新 → 报告页
name: Data Refresh (Global)
on:
  schedule:
    - cron: '30 6 * * *'   # 北京时间 14:30（美股收盘后）
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Refresh global data + report
        run: |
          python3 - <<'PY'
          import os, json, datetime
          # MVP 占位：接 yfinance/CoinGecko 拉全球行情喂 multi_factor_model
          os.makedirs("reports", exist_ok=True)
          day = datetime.date.today().isoformat()
          payload = {"date": day, "signals": [], "note": "MVP 占位；接 yfinance 后填充全球多因子信号"}
          json.dump(payload, open(f"reports/{day}.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          json.dump(payload, open("reports/latest.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          print("report @", day)
          PY
      - name: Commit report
        run: |
          git config user.name "global-bot"; git config user.email "bot@example.com"
          git add reports/ && (git commit -m "chore(global-investment-mlp): 每日报告 $(date +%F)" || echo "no change"); git push
