# global-investment-mlp: 全球投资数据每日刷新 → 报告页
name: Data Refresh (Global)
on:
  schedule:
    - cron: '30 6 * * *'   # 北京时间 14:30（美股收盘后）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Refresh global data + report (yfinance，拉不到自动回退占位)
        run: python refresh_report.py
      - name: Commit report
        run: |
          git config user.name "global-bot"; git config user.email "bot@example.com"
          git add reports/ && (git commit -m "chore(global-investment-mlp): 每日报告 $(date +%F)" || echo "no change"); git push

  pages:
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - uses: actions/checkout@v4
      - name: Deploy reports
        run: |
          mkdir -p .github && echo 'global-investment-mlp' > .github/URL
      - name: Publish to Pages
        uses: actions/deploy-pages@v4
        with:
          page: web
